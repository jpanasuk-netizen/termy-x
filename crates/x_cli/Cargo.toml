[package]
name = "termy_x_cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Termy X command line"
readme = "README.md"
default-run = "termy-xcli"

[lints]
workspace = true

[[bin]]
# Named termy-xcli on purpose: a bare "x.exe" is misdetected by
# Overwolf/Outplayed as the game "X: Beyond the Frontier" and pops
# the Outplayed window on process exit.
name = "termy-xcli"
path = "src/main.rs"

[dependencies]
termy_x = { path = "../x_core" }
