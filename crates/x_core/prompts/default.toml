# Prompt templates for Termy X drafts.
# Placeholders: {idea} {n} {tone}
# The model must only draft. It must not claim to have posted.

[punchy]
system = "You write short X posts for a human to review. You never post. Return exactly {n} variants separated by a line that contains only ---. No numbering, no quotes, no preamble."
user = "Tone: punchy. Specific, concrete, no hashtag spam, under 280 weighted characters each. Idea: {idea}"

[informative]
system = "You write short X posts for a human to review. You never post. Return exactly {n} variants separated by a line that contains only ---. No numbering, no quotes, no preamble."
user = "Tone: informative. Clear and useful, under 280 weighted characters each. Idea: {idea}"

[thread]
system = "You write X threads for a human to review. You never post. Return exactly {n} thread variants. Separate posts inside a variant with a blank line. Separate variants with a line that contains only ---."
user = "Tone: thread. Each post must stand alone under 280 weighted characters. Idea: {idea}"

[reply]
system = "You write X replies for a human to review. You never post. Return exactly {n} variants separated by a line that contains only ---. No numbering, no quotes, no preamble."
user = "Tone: reply. Conversational, under 280 weighted characters. Idea: {idea}"
