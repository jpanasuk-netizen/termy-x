[package]
name = "termy_x"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Headless X providers, drafting, and publish confirmation for Termy X"
readme = "README.md"

[lints]
workspace = true

# No target-gated deps needed: all deps here are shared/pure-Rust. The
# Windows-only behaviour in src/io.rs (CREATE_NO_WINDOW, Chrome/OpenCLI
# window silencer via hand-rolled user32 FFI, PATHEXT/.cmd shim lookup)
# is #[cfg(windows)] in code with a no-op stub on other OSes; %APPDATA%-
# style paths go through shared `dirs`, which resolves XDG on Linux.
[dependencies]
aho-corasick = "1"
anyhow = { workspace = true }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = { workspace = true }
keyring = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
unicode-normalization = "0.1.24"
unicode-segmentation = "=1.12.0"
ureq = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
