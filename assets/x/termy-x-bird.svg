<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3440 1440" width="1720" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Termy X geometric swift</title>
  <desc id="desc">Original low-poly swift in electric blue and cyan on a navy starfield, with a magenta heart badge. An independent geometric drawing.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#07111c"/>
      <stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7af6ff"/>
      <stop offset="0.45" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#1236c9"/>
    </linearGradient>
    <linearGradient id="wing-low" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#19d7ff"/>
      <stop offset="1" stop-color="#0a3ea8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fbff"/>
      <stop offset="0.35" stop-color="#4cc8ff"/>
      <stop offset="1" stop-color="#1a4dff"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2aa7ff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#124bff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#124bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="heartglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="86" height="86" patternUnits="userSpaceOnUse">
      <path d="M86 0 H0 V86" fill="none" stroke="#16324a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="3440" height="1440" fill="url(#sky)"/>
  <rect width="3440" height="1440" fill="url(#grid)" opacity="0.55"/>

  <g fill="#d7f7ff">
    <circle cx="180" cy="160" r="1.4" opacity="0.8"/>
    <circle cx="420" cy="280" r="1.1" opacity="0.55"/>
    <circle cx="640" cy="120" r="1.8" opacity="0.7"/>
    <circle cx="880" cy="340" r="1.2" opacity="0.45"/>
    <circle cx="1100" cy="90" r="1.5" opacity="0.75"/>
    <circle cx="1320" cy="240" r="1.1" opacity="0.5"/>
    <circle cx="1560" cy="140" r="1.6" opacity="0.65"/>
    <circle cx="1880" cy="80" r="1.3" opacity="0.55"/>
    <circle cx="2140" cy="200" r="1.2" opacity="0.4"/>
    <circle cx="2460" cy="110" r="1.7" opacity="0.7"/>
    <circle cx="2720" cy="260" r="1.1" opacity="0.5"/>
    <circle cx="2980" cy="150" r="1.5" opacity="0.6"/>
    <circle cx="3220" cy="320" r="1.3" opacity="0.45"/>
    <circle cx="260" cy="620" r="1.2" opacity="0.4"/>
    <circle cx="540" cy="780" r="1.6" opacity="0.55"/>
    <circle cx="760" cy="540" r="1.1" opacity="0.35"/>
    <circle cx="980" cy="900" r="1.4" opacity="0.5"/>
    <circle cx="1240" cy="1100" r="1.2" opacity="0.4"/>
    <circle cx="1680" cy="1180" r="1.5" opacity="0.45"/>
    <circle cx="2100" cy="1240" r="1.1" opacity="0.35"/>
    <circle cx="2480" cy="1080" r="1.6" opacity="0.5"/>
    <circle cx="2860" cy="980" r="1.2" opacity="0.4"/>
    <circle cx="3180" cy="860" r="1.4" opacity="0.55"/>
    <circle cx="3360" cy="540" r="1.1" opacity="0.4"/>
    <circle cx="300" cy="1280" r="1.3" opacity="0.3"/>
    <circle cx="1900" cy="1320" r="1.2" opacity="0.28"/>
    <circle cx="1500" cy="480" r="1.4" opacity="0.35"/>
    <circle cx="2300" cy="640" r="1.1" opacity="0.3"/>
  </g>

  <ellipse cx="1760" cy="760" rx="560" ry="320" fill="url(#bloom)" filter="url(#soft)"/>

  <!-- Original low-poly swift. Long knife wings, diamond body, forked tail. Faces upper-left. -->
  <g transform="translate(1180 250)">
    <polygon points="520,210 40,40 250,150 430,230" fill="url(#wing)" opacity="0.95"/>
    <polygon points="500,250 90,470 280,330 470,290" fill="url(#wing-low)"/>
    <polygon points="250,150 430,230 470,290 280,330 210,240" fill="url(#body)"/>
    <polygon points="210,240 90,220 160,190 250,150" fill="#e9fdff"/>
    <polygon points="90,220 20,236 70,250 160,190" fill="#7af6ff"/>
    <polygon points="470,290 620,250 560,330 500,250" fill="#163cff"/>
    <polygon points="500,250 680,310 590,360 470,290" fill="#0c2f9a"/>
    <polygon points="250,150 300,120 360,175 280,200" fill="#bff7ff" opacity="0.85"/>
    <polygon points="430,230 520,210 500,250 470,290" fill="#59d4ff" opacity="0.9"/>
    <g fill="none" stroke="#e8fbff" stroke-width="2" stroke-linejoin="round" opacity="0.72">
      <polygon points="520,210 40,40 250,150 430,230"/>
      <polygon points="500,250 90,470 280,330 470,290"/>
      <polygon points="250,150 430,230 470,290 280,330 210,240"/>
      <polygon points="210,240 90,220 160,190"/>
      <polygon points="90,220 20,236 70,250"/>
      <polygon points="470,290 620,250 560,330"/>
      <polygon points="500,250 680,310 590,360"/>
    </g>
    <circle cx="150" cy="205" r="7" fill="#071018"/>
    <circle cx="148" cy="203" r="2.4" fill="#e9fdff"/>
  </g>

  <g transform="translate(2140 390)" filter="url(#heartglow)">
    <circle cx="0" cy="10" r="108" fill="#1a0614" stroke="#ff4fa3" stroke-width="3" opacity="0.92"/>
    <path d="M0 34 C0 16 -20 4 -38 16 C-60 30 -56 60 -34 76 C-20 86 0 100 0 100 C0 100 20 86 34 76 C56 60 60 30 38 16 C20 4 0 16 0 34 Z" fill="#ff3d9a"/>
    <path d="M-16 40 C-26 24 -42 26 -42 40" fill="none" stroke="#ffd0ea" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <text x="0" y="158" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="40" font-weight="700" fill="#ffd0ea">+1</text>
  </g>
</svg>
